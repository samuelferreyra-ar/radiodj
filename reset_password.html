<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer contraseña - RADIO DJ 101.5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header"></div>

  <main style="display:grid; place-items:center; min-height:calc(100dvh - 160px); padding:3% 10%;">
    <div class="login-card">
      <div class="logo">RADIO DJ 101.5</div>
      <h1>Restablecer contraseña</h1>

      <form id="confirmResetForm">
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input id="newPass1" type="password" placeholder="Nueva contraseña" required>
        </div>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input id="newPass2" type="password" placeholder="Repetir nueva contraseña" required>
        </div>
        <button type="submit">Guardar nueva contraseña</button>
      </form>

      <p id="resetMsg" style="margin-top:10px;"></p>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="js/componentes.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
