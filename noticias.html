<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RADIO DJ 101.5 - Noticias</title>
  <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="footer.css">
  <style>
    /* Layout */
    .frame{max-width:1100px;margin:0 auto;position:relative;padding:32px 24px}
    .side-banner{position:absolute;top:64px;bottom:0;width:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .side-banner.left{left:-48px}
    .side-banner.right{right:-48px}
    .side-banner span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px;font-weight:800}

    /* Noticias */
    .news-card{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden;padding:20px}
    .news-header{background:var(--red);color:#fff;padding:14px 20px;font-weight:800;font-size:1.2rem;text-align:center;margin:-20px -20px 20px -20px;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}

    /* Tabs estilo barra */
    .tabs{display:flex;gap:28px;justify-content:flex-start;padding:0 10px;border-bottom:2px solid #eee;margin-bottom:24px;}
    .tab{padding:10px 0;font-weight:600;cursor:pointer;position:relative;color:var(--text);font-size:1rem;}
    .tab.active{color:var(--red)}
    .tab.active::after{content:'';position:absolute;left:0;bottom:-2px;width:100%;height:3px;background:var(--red);border-radius:2px}

    /* Noticias grid */
    .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
    .card{background:#fff;border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .thumb{
      height:160px;
      background:#e9edf2;
    }
    .thumb img{
      width:100%;
      height:160px;
      object-fit:cover;
      display:block;
    }

    .card-body{padding:16px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
    .badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600;margin-bottom:8px;color:#fff}
    .badge.local{background:#d83c40}
    .badge.internacional{background:#1e3550}
    .badge.musica{background:#7a3dc7}
    .badge.cultura{background:#f39c12}

    .card-body h3{font-size:1.05rem;margin-bottom:8px;color:var(--text)}
    .card-body p{font-size:.9rem;color:var(--muted);margin-bottom:12px;flex:1}
    .read-more{font-weight:600;color:var(--red);font-size:.9rem;cursor:pointer}

    .comments{margin-top:12px;font-size:.85rem;color:var(--text)}
    .comments b{color:var(--text)}
    .comments span{display:block;color:var(--muted);margin-left:8px;font-size:.82rem}

    /* Responsive */
    @media(max-width:900px){
      .footer-inner{grid-template-columns:1fr}
      .side-banner{display:none}
    }
    /* Contenedor de imagen */
    .card .thumb{
      height:160px;
      overflow:hidden;           /* recorta lo que sobra */
      border-radius:10px 10px 0 0; /* mismo radio que la card arriba */
    }

    /* Imagen */
    .card .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;          /* recorta sin deformar */
      display:block;
    }
  </style>
</head>
<body>
  
  <div id="header"></div>

  <div class="frame">

    <section class="news-card">
      <div class="news-header">NOTICIAS</div>
      <div class="tabs">
        <div class="tab active" data-category="all">Todas</div>
        <div class="tab" data-category="local">Locales</div>
        <div class="tab" data-category="internacional">Internacionales</div>
        <div class="tab" data-category="musica">Música</div>
      </div>
    <div class="news-grid" id="newsGrid"></div>
    </section>
  </div>

  <div id="footer"></div>

<!-- Modal Nota Completa -->
<div id="notaModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="notaModalTitle">
  <div class="modal-overlay" data-act="close"></div>

  <div class="modal-dialog" role="document">
    <button class="modal-close" aria-label="Cerrar" data-act="close">✕</button>

    <div class="modal-head">
      <h2 id="notaModalTitle"></h2>
      <div class="modal-meta">
        <span id="notaModalBadge" class="badge local">Local</span>
        <span id="notaModalDate" class="muted"></span>
      </div>
    </div>

    <div class="modal-thumb">
      <img id="notaModalImg" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='404.png';">
    </div>

    <div id="notaModalBody" class="modal-body"></div>
  </div>
</div>

  <script type="module">
  import { fetchNotasPublicas, renderCardNoticias } from "./js/noticias-publicas.js";

  const grid = document.getElementById("newsGrid");
  const tabs = document.querySelectorAll(".tab");
  let all = [];

  function applyFilter(cat){
    const cards = grid.querySelectorAll(".card");
    cards.forEach(card => {
      const c = card.dataset.category;
      card.style.display = (cat === "all" || c === cat) ? "flex" : "none";
    });
  }

  async function load(){
    try{
      all = await fetchNotasPublicas(); // todas publicadas
      grid.innerHTML = all.map(renderCardNoticias).join("");

      // Si querés luego abrir una nota completa, acá engancharías “Leer Más”
      function badgeClass(cat){
  if (cat === "local") return "local";
  if (cat === "internacional") return "internacional";
  if (cat === "musica") return "musica";
  return "local";
}
function badgeLabel(cat){
  if (cat === "local") return "Local";
  if (cat === "internacional") return "Internacional";
  if (cat === "musica") return "Música";
  return "Nota";
}

function openModal(nota){
  const modal = document.getElementById("notaModal");
  const title = document.getElementById("notaModalTitle");
  const body  = document.getElementById("notaModalBody");
  const img   = document.getElementById("notaModalImg");
  const badge = document.getElementById("notaModalBadge");
  const date  = document.getElementById("notaModalDate");

  if(!modal || !title || !body || !img || !badge) return;

  const cat = (nota.categoria || "local").toString();
  title.textContent = nota.titulo || "";

  // Imagen (con fallback)
  img.src = (nota.imagenUrl || "").trim() || "404.png";
  img.alt = nota.titulo || "Noticia";

  // Badge
  badge.className = `badge ${badgeClass(cat)}`;
  badge.textContent = badgeLabel(cat);

  // Fecha (opcional: usa updatedAt si existe)
  try{
    const ts = nota.updatedAt?.toDate ? nota.updatedAt.toDate() : null;
    date.textContent = ts ? ts.toLocaleDateString() : "";
  }catch{
    date.textContent = "";
  }

  // Cuerpo (HTML permitido según tu editor)
  // Si querés que sea texto plano por seguridad, avisame y lo sanitizamos.
  body.innerHTML = (nota.cuerpo || "").toString();

  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  const modal = document.getElementById("notaModal");
  if(!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

// Delegación: 1 solo listener para toda la grilla
grid.addEventListener("click", (e)=>{
  const btn = e.target.closest('[data-act="leer"]');
  if(!btn) return;
  const id = btn.getAttribute("data-id");
  const nota = all.find(n => n.id === id);
  if(nota) openModal(nota);
});

// Cierres del modal
document.addEventListener("click", (e)=>{
  const modal = document.getElementById("notaModal");
  if(!modal || !modal.classList.contains("open")) return;
  if(e.target.matches("[data-act='close']")) closeModal();
});

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeModal();
});


      applyFilter("all");
    }catch(e){
      console.error("Noticias load:", e);
    }
  }

  tabs.forEach(tab=>{
    tab.addEventListener("click", ()=>{
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      applyFilter(tab.getAttribute("data-category"));
    });
  });

  load();
</script>
  
<!-- Importación de componentes -->

<script type="module" src="js/componentes.js"></script>

<!-- Notificaciones -->

<script type="module" src="./js/notificaciones.js"></script>

</body>
</html>
