<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RADIO DJ 101.5 - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="footer.css">
  <style>
    :root{
      --red:#d83c40;
      --navy:#1e3550;
      --bg:#f2f4f7;
      --text:#1a1f29;
      --muted:#6b7789;
      --radius:12px;
      --shadow:0 8px 20px rgba(0,0,0,.2);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--text)}
    a{text-decoration:none;color:inherit}

    /* Header */
    .topbar{background:var(--red);color:#fff;padding:14px 24px;position:sticky;top:0;z-index:50}
    .topbar .wrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:800}
    nav ul{display:flex;gap:20px;list-style:none}
    nav a{font-weight:600;opacity:.95}
    nav a:hover{text-decoration:underline;opacity:1}

    /* Layout */
    .frame{max-width:1100px;margin:0 auto;position:relative;padding:32px 24px}
    .side-banner{position:absolute;top:64px;bottom:0;width:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .side-banner.left{left:-48px}
    .side-banner.right{right:-48px}
    .side-banner span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px;font-weight:800}

    /* Contact Card */
    .contact-card{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden;padding:20px}
    .contact-header{background:var(--red);color:#fff;padding:14px 20px;font-weight:800;font-size:1.2rem;text-align:center;margin:-20px -20px 20px -20px;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
    .contact-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .icons{width: 30px; height: 30px;}

    form{display:grid;gap:12px}
    input,textarea{padding:10px;border:1px solid #ccd2da;border-radius:6px;font-size:.95rem}
    textarea{min-height:100px;resize:vertical}
    .btn-submit{background:var(--navy);color:#fff;border:none;padding:12px;font-weight:700;border-radius:6px;cursor:pointer}
    .btn-submit:hover{background:#162840}

    .info h4{margin-bottom:10px;font-size:1.05rem;color:var(--text)}
    .info p{margin-bottom:10px;font-size:.9rem;color:var(--text)}
    .icon{margin-right:6px;color:var(--red)}
    .social{display:flex;gap:10px;margin-top:10px}
    .social a{font-size:1.2rem;color:var(--navy)}

    /* Nuestra Información */
    .info {display: flex;flex-direction: column;gap: 18px;}
    .info-item {display: flex;align-items: flex-start; gap: 12px;}
    .info-icon {min-width: 38px;display: flex;justify-content: center;}
    .info-icon img {width: 30px;height: 30px;}
    .info-text strong {display: block;margin-bottom: 4px;font-size: 0.95rem;}
    .info-text p {margin: 0;font-size: 0.88rem;line-height: 1.4;}

    /* Map section */
    .map {margin-top: 24px;border-radius: var(--radius);overflow: hidden;box-shadow: var(--shadow);height: 260px;}
    .map iframe {width: 100%;height: 100%;border: 0;}


    /* Footer */
    footer{background:var(--navy);color:#e7edf6;margin-top:40px}
    .footer-inner{max-width:1100px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
    footer h4{margin-bottom:12px;color:#fff}
    .links{display:grid;gap:8px}
    .btn-live{background:#ef4452;color:#fff;font-weight:700;border:none;border-radius:999px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
    .badges{display:flex;gap:8px;margin-top:10px}
    .badge1{display:inline-flex; align-items:center; gap:6px; background-color: black; border-radius:8px; padding:8px 10px; font-size:.82rem}
    .badge2{display:inline-flex; align-items:center; gap:6px; background-color: green; border-radius:8px; padding:8px 10px; font-size:.82rem}
    .copyright{text-align:center;border-top:1px solid rgba(255,255,255,.2);padding:14px 0;margin-top:20px;font-size:.85rem}

    /* Responsive */
    @media(max-width:900px){
      .contact-body{grid-template-columns:1fr}
      .footer-inner{grid-template-columns:1fr}
      .side-banner{display:none}
      .info {align-items: center;text-align: center;}
      .info-item {flex-direction: column;align-items: center;}
      .info-icon {margin-bottom: 4px;}
      .map {height: 300px;}
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="frame">
    <aside class="side-banner left"><span>PUBLICIDAD</span></aside>
    <aside class="side-banner right"><span>PUBLICIDAD</span></aside>

    <section class="contact-card">
      <div class="contact-header">CONTÁCTANOS</div>
      <div class="contact-body">
        <form>
          <input type="text" placeholder="Nombre" required />
          <input type="email" placeholder="Correo electrónico" required />
          <input type="text" placeholder="Asunto" />
          <textarea placeholder="Mensaje" required></textarea>
          <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>
        <div class="info">
          <h3>Nuestra Información</h3><br>
          
          <div class="info-item">
            <div class="info-icon">
              <img src="img/ubicacion.png" alt="Ubicación">
            </div>
            <div class="info-text">
              <strong>Dirección</strong>
              <p>Calle Julio A Roca 1830, Sierras Bayas, CT 7403</p>
            </div>
          </div>

          <div class="info-item">
            <div class="info-icon">
              <img src="img/telefono.png" alt="Teléfono">
            </div>
            <div class="info-text">
              <strong>Teléfono</strong>
              <p>+54 2284 614456</p>
              <p>Línea del Estudio: 492 092</p>
            </div>
          </div>

          <div class="info-item">
            <div class="info-icon">
              <img src="img/correo.png" alt="Correo">
            </div>
            <div class="info-text">
              <strong>Correo Electrónico</strong>
              <p>info@radiodj1015.com</p>
              <p>estudio@radiodj1015.com</p>
            </div>
          </div>

          <div class="info-item">
            <div class="info-icon">
              <img src="img/chat.png" alt="WhatsApp">
            </div>
            <div class="info-text">
              <strong>WhatsApp</strong>
              <p>+54 2284 614456</p>
            </div>
          </div>

          <p><h4>Síguenos en Redes</h4></p>
          <div class="social">
            <a href="#"><img class="icons" src="img/facebook.png" alt=""></a>
            <a href="#"><img class="icons" src="img/instagram.png" alt=""></a>
            <a href="#"><img class="icons" src="img/twitter.png" alt=""></a>
            <a href="#"><img class="icons" src="img/youtube.png" alt=""></a>
            <a href="#"><img class="icons" src="img/spotify.png" alt=""></a>
          </div>
        </div>
      </div>

      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d199.3318967911931!2d-60.16052299025129!3d-36.93075044582682!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95943fba220f5a9d%3A0xbfb50298836c3aa7!2sRadio%20DJ%20101.5!5e0!3m2!1ses-419!2sar!4v1765307487216!5m2!1ses-419!2sar"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>


    </section>
  </div>

  <div id="footer"></div>

<script type="module" src="js/componentes.js"></script>

<!-- Notificaciones -->

<script type="module" src="./js/notificaciones.js"></script>

</body>
</html>
