<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RADIO DJ 101.5</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="footer.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* Contenedor de imagen */
    .card .thumb{
      height:160px;
      overflow:hidden;           /* recorta lo que sobra */
      border-radius:10px 10px 0 0; /* mismo radio que la card arriba */
    }

    /* Imagen */
    .card .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;          /* recorta sin deformar */
      display:block;
    }
  </style>
</head>
<body>
  
<div id="header"></div>

  <div class="frame">
    <aside class="side-banner left" aria-label="Publicidad"><span>PUBLICIDAD</span></aside>
    <aside class="side-banner right" aria-label="Publicidad"><span>PUBLICIDAD</span></aside>

    <section class="hero" role="banner">
      <div class="hero-inner">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/iipR5yUp36o?si=sumcmuU_RIMLwvGP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <!-- index.html (dentro de .hero-inner, al lado del disco) -->
        <div class="live-chat" aria-label="Chat en vivo">
          <div class="chat-header">Chat en vivo</div>
          <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
          <form id="chatForm" class="chat-input-area">
            <input id="chatInput" type="text" placeholder="Escribe un mensaje..." maxlength="400" required>
            <button type="submit" title="Enviar">Enviar</button>
          </form>
          <div id="chatLoginHint" class="chat-hint" hidden>
            Inicia sesión para participar en el chat.
            <a href="login.html" class="chat-login-link">Iniciar sesión</a>
          </div>
        </div>
      </div>
    </section>

    <section class="card calendario" aria-label="Calendario de programación">
  <div class="cal-head">
    <button class="cal-nav" id="calPrev" aria-label="Mes anterior">‹</button>
    <h2 id="calTitle">Mes Año</h2>
    <button class="cal-nav" id="calNext" aria-label="Mes siguiente">›</button>
  </div>
  <div class="cal-grid" id="calGrid" role="grid" aria-labelledby="calTitle">
    <!-- se rellena con JS -->
  </div>
</section>

<!-- Modal popup -->
<div class="cal-modal" id="calModal" aria-hidden="true" role="dialog" aria-labelledby="calModalTitle">
  <div class="cal-modal__dialog">
    <div class="cal-modal__head">
      <h3 id="calModalTitle">Programación del día</h3>
      <button id="calModalClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="cal-modal__body" id="calModalBody">
      <!-- items de programas -->
    </div>
  </div>
</div>

    <section id="noticias" class="news-section" aria-labelledby="news-title">
      <h2 id="news-title">NOTICIAS LOCALES</h2>
      <div class="cards" id="indexNewsCards"></div>
    </section>

<div id="footer"></div>

  </div>

<!-- Importación de componentes -->

<script type="module" src="js/componentes.js"></script>

<!-- Notificaciones -->

<script type="module" src="./js/notificaciones.js"></script>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/chat.js"></script>
<script type="module" src="js/calendario.js"></script>
<script type="module">
  import { fetchNotasPublicas, renderCardIndex } from "./js/noticias-publicas.js";

  const cont = document.getElementById("indexNewsCards");
  if (cont) {
    try {
      // Últimas 3 LOCALES
      const notas = await fetchNotasPublicas({ categoria: "local", take: 3 });
      cont.innerHTML = notas.map(renderCardIndex).join("");
    } catch (e) {
      console.error("Index noticias:", e);
      // fallback silencioso
    }
  }
</script>

</body>

</html>
