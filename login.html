<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - RADIO DJ 101.5</title>

  <!-- Tipografía y estilos globales -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Igual que en index: estilos del footer -->
  <link rel="stylesheet" href="footer.css">
</head>
<body>

  <!-- Igual que en index -->
  <div id="header"></div>

  <!-- Contenido de login -->
  <main style="display:grid; place-items:center; min-height:calc(100dvh - 160px); padding:3% 10%;">
    <div class="login-card">
      <div class="logo">RADIO DJ 101.5</div>
      <h1>Inicia Sesión</h1>

      <form id="loginForm">
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input id="loginUserOrEmail" type="text" placeholder="Ingrese su e-mail" required>
        </div>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input id="loginPassword" type="password" placeholder="Ingrese su contraseña" required>
        </div>

        <div class="checkbox-container">
          <label><input type="checkbox" id="rememberMe"> Recordarme</label>
          <a href="olvidaste_contraseña.html">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <div class="links">
        <a href="registro.html">Registrarse</a>
        <a href="ayuda.html">Ayuda</a>
      </div>
    </div>
  </main>

  <!-- Igual que en index -->
  <div id="footer"></div>

  <!-- Scripts (módulos) -->
   <script src="https://cdn.jsdelivr.net/npm/validator@13.11.0/validator.min.js"></script>
   <script type="module" src="js/componentes.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
